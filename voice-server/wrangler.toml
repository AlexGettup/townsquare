name = "townsquare-voice"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Workers Logs (free plan: 200,000 lines a day, kept 3 days): what goes wrong
# in a game (closed sockets, SFU errors, clients' reports) can be read later
[observability]
enabled = true

[vars]
# pages allowed to use the voice server (localhost and LAN are always allowed)
ALLOWED_ORIGINS = "https://alexgettup.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "VoiceRoom"

# the live session (game sync), see src/live.js
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

# SQLite-backed Durable Objects are the ones available on the free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LiveRoom"]
