name: Deploy (voice server, then GitHub Pages)
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # the Cloudflare Worker (voice, chat and live session) goes first: the app
  # it serves may need what this version of the Worker adds
  deploy-voice-server:
    concurrency: voice-server
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: voice-server
    steps:
      - name: Checkout 🛎️
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node 🟢
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: voice-server/package-lock.json

      - name: Deploy the Worker ☁️
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci
          npx wrangler deploy

      - name: No Cloudflare token, Worker not deployed
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: .
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, the voice server was not deployed (see voice-server/README.md)"

  build-and-deploy:
    needs: deploy-voice-server
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
