name: Deploy (voice server, then GitHub Pages)
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # the Cloudflare Worker (voice, chat and live session) goes first: the app
  # it serves may need what this version of the Worker adds
  deploy-voice-server:
    concurrency: voice-server
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: voice-server
    steps:
      - name: Checkout 🛎️
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node 🟢
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          # wrangler needs Node 22 or newer
          node-version: 22
          cache: npm
          cache-dependency-path: voice-server/package-lock.json

      - name: Deploy the Worker ☁️
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci
          npx wrangler deploy

      - name: No Cloudflare token, Worker not deployed
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: .
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, the voice server was not deployed (see voice-server/README.md)"

  build-and-deploy:
    needs: deploy-voice-server
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # the app syncs games through the Worker's /live/ (VUE_APP_LIVE_SERVER
      # in .env): don't publish it while the Worker out there lacks it
      - name: Check the live session server ☁️
        run: |
          set -a; . ./.env; set +a
          if [ -n "$VUE_APP_VOICE_URL" ] && [ "$VUE_APP_LIVE_SERVER" != "original" ]; then
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Origin: https://${GITHUB_REPOSITORY_OWNER,,}.github.io" \
              "$VUE_APP_VOICE_URL/live/check/host")
            if [ "$status" != "426" ]; then
              echo "::error::The voice server has no live session (HTTP $status): deploy it (voice-server/README.md) or set VUE_APP_LIVE_SERVER=original"
              exit 1
            fi
          fi

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

      # every deploy to main is a release: tag it with package.json's version,
      # on the commit that was actually published (only once it went out)
      - name: Tag the release 🏷️
        run: |
          version=$(node -p "require('./package.json').version")
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json has no valid version ($version)"
            exit 1
          fi
          tag="v$version"
          # the commit it points to (an annotated tag's "^{}" line comes last)
          tagged=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1)
          if [ -z "$tagged" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Version ${tag#v}"
            git push origin "$tag"
          elif [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::warning::$tag already exists on another commit ($tagged): was the version bumped? The tag was left as it was"
          fi
